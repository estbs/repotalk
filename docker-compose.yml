services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: repotalk
      POSTGRES_PASSWORD: repotalk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repotalk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
